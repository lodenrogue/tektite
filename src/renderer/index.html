<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tektite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand-bar">
          <div>
            <div class="brand">Tektite</div>
            <div class="vault-name" id="vaultName">No vault open</div>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="openVaultButton" type="button" data-tooltip="Open Vault" aria-label="Open Vault">
              <svg class="toolbar-icon toolbar-icon-folder" aria-hidden="true" viewBox="0 0 32 32">
                <path d="M4 10.5h8.2c1.3 0 2.2.5 3 1.5l1 1.2H28"></path>
                <path d="M4 10.5v13A2.5 2.5 0 0 0 6.5 26h19a2.5 2.5 0 0 0 2.5-2.5v-10A2.5 2.5 0 0 0 25.5 11H16"></path>
                <path d="M6 8h6.5c1.1 0 1.8.4 2.5 1.3l1.2 1.7"></path>
              </svg>
            </button>
            <button id="refreshButton" class="icon-button" type="button" data-tooltip="Refresh" aria-label="Refresh">
              <svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M19 8a7.5 7.5 0 1 0 1 6"></path>
                <path d="M19 4v4h-4"></path>
              </svg>
            </button>
            <button id="suffixButton" class="icon-button" type="button" data-tooltip="Show File Suffixes" aria-label="Show File Suffixes">
              <span id="suffixIcon" aria-hidden="true">.md</span>
            </button>
            <button id="themeButton" class="icon-button" type="button" data-tooltip="Light Mode" aria-label="Light Mode">
              <span id="themeIcon" class="theme-icon" aria-hidden="true" data-mode="dark">
                <svg class="toolbar-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2.75v2"></path>
                  <path d="M12 19.25v2"></path>
                  <path d="M4.75 4.75l1.4 1.4"></path>
                  <path d="M17.85 17.85l1.4 1.4"></path>
                  <path d="M2.75 12h2"></path>
                  <path d="M19.25 12h2"></path>
                  <path d="M4.75 19.25l1.4-1.4"></path>
                  <path d="M17.85 6.15l1.4-1.4"></path>
                </svg>
                <svg class="toolbar-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M19.5 14.2A7.6 7.6 0 0 1 9.8 4.5a8.2 8.2 0 1 0 9.7 9.7z"></path>
                </svg>
              </span>
            </button>
          </div>
        </header>

        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search notes" autocomplete="off" />
        </div>

        <nav class="file-tree" id="fileTree" aria-label="Vault files"></nav>
        <hr id="sidebarGraphResizer" class="resizer-y resizer-sidebar-graph" aria-label="Resize file list and graph">
        <section class="sidebar-graph-pane">
          <div class="pane-header">Graph</div>
          <section id="graph" class="graph-view" aria-label="Graph view">
            <svg id="graphSvg" role="img" aria-label="Note graph"></svg>
            <div id="graphEmpty" class="graph-empty hidden">No links yet</div>
          </section>
        </section>
      </aside>
      <hr id="sidebarResizer" class="resizer resizer-sidebar" aria-label="Resize sidebar">

      <main class="workspace">
        <section class="editor-pane">
          <div class="note-toolbar">
            <div>
              <div class="note-title" id="noteTitle">Open a vault</div>
              <div class="note-path" id="notePath">Choose a local folder to start.</div>
            </div>
            <div class="save-state" id="saveState">Idle</div>
          </div>
          <div id="editorTabs" class="editor-tabs" role="tablist" aria-label="Open files"></div>
          <textarea id="editor" spellcheck="true" disabled></textarea>
          <div id="imageViewer" class="image-viewer hidden" aria-label="Image viewer">
            <img id="imageViewerImage" alt="">
          </div>
          <div id="mentionMenu" class="mention-menu hidden" aria-label="Select note link"></div>
        </section>
        <hr id="workspaceResizer" class="resizer resizer-workspace" aria-label="Resize editor and preview panes">

        <section class="preview-pane">
          <div class="pane-header preview-header">
            <span>Preview</span>
            <div class="preview-nav-actions" aria-label="Preview navigation">
              <button id="previewBackButton" class="icon-button preview-nav-button" type="button" aria-label="Back" disabled>
                <span aria-hidden="true">‹</span>
              </button>
              <button id="previewForwardButton" class="icon-button preview-nav-button" type="button" aria-label="Forward" disabled>
                <span aria-hidden="true">›</span>
              </button>
            </div>
          </div>
          <article id="preview" class="markdown-preview"></article>
        </section>
      </main>
    </div>

    <div id="treeContextMenu" class="context-menu hidden" role="menu"></div>

    <dialog id="nameDialog" class="modal-backdrop hidden" aria-labelledby="nameDialogTitle">
      <form id="nameForm" class="modal">
        <header class="modal-header">
          <h2 id="nameDialogTitle">New node</h2>
          <button id="cancelNameXButton" class="icon-button" type="button" aria-label="Close">×</button>
        </header>
        <label class="field-label" for="nameInput">Name</label>
        <input id="nameInput" class="modal-input" type="text" value="Untitled" autocomplete="off" />
        <footer class="modal-actions">
          <button id="cancelNameButton" class="secondary-button" type="button">Cancel</button>
          <button id="confirmNameButton" class="primary-button" type="submit">Create</button>
        </footer>
      </form>
    </dialog>

    <script src="./renderer.js"></script>
  </body>
</html>
