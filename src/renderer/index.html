<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tektite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand-bar">
          <div>
            <div class="brand">Tektite</div>
            <div class="vault-name" id="vaultName">No vault open</div>
          </div>
          <div class="header-actions">
            <button class="icon-button" id="openVaultButton" type="button" data-tooltip="Open Vault" aria-label="Open Vault">
              <svg class="toolbar-icon toolbar-icon-folder" aria-hidden="true" viewBox="0 0 32 32">
                <path d="M4 10.5h8.2c1.3 0 2.2.5 3 1.5l1 1.2H28"></path>
                <path d="M4 10.5v13A2.5 2.5 0 0 0 6.5 26h19a2.5 2.5 0 0 0 2.5-2.5v-10A2.5 2.5 0 0 0 25.5 11H16"></path>
                <path d="M6 8h6.5c1.1 0 1.8.4 2.5 1.3l1.2 1.7"></path>
              </svg>
            </button>
            <button id="refreshButton" class="icon-button" type="button" data-tooltip="Refresh" aria-label="Refresh">
              <svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M19 8a7.5 7.5 0 1 0 1 6"></path>
                <path d="M19 4v4h-4"></path>
              </svg>
            </button>
            <button id="gitSyncButton" class="icon-button hidden" type="button" data-tooltip="Git Sync" aria-label="Git Sync" disabled>
              <svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="6" cy="5" r="2.5"></circle>
                <circle cx="6" cy="19" r="2.5"></circle>
                <circle cx="18" cy="12" r="2.5"></circle>
                <path d="M6 7.5v9"></path>
                <path d="M8.2 17.8 15.8 13.2"></path>
              </svg>
            </button>
            <button id="githubSyncButton" class="icon-button hidden" type="button" data-tooltip="GitHub Sync" aria-label="GitHub Sync" disabled>
              <svg class="toolbar-icon toolbar-icon-github" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M9.2 19.1c-5 1.5-5-2.5-7-3"></path>
                <path d="M14.8 22v-3.9c.1-.9-.2-1.7-.8-2.3 2.7-.3 5.5-1.3 5.5-5.9a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.3 1.2a11.4 11.4 0 0 0-6 0C6.5 3.2 5.5 3.5 5.5 3.5a4.2 4.2 0 0 0-.1 3.2 4.6 4.6 0 0 0-1.3 3.2c0 4.6 2.8 5.6 5.5 5.9a3.4 3.4 0 0 0-.9 2.3V22"></path>
              </svg>
            </button>
            <button id="suffixButton" class="icon-button" type="button" data-tooltip="Show File Suffixes" aria-label="Show File Suffixes">
              <span id="suffixIcon" aria-hidden="true">.md</span>
            </button>
            <button id="settingsButton" class="icon-button" type="button" data-tooltip="Settings" aria-label="Settings">
              <svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
            <button id="themeButton" class="icon-button" type="button" data-tooltip="Light Mode" aria-label="Light Mode">
              <span id="themeIcon" class="theme-icon" aria-hidden="true" data-mode="dark">
                <svg class="toolbar-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2.75v2"></path>
                  <path d="M12 19.25v2"></path>
                  <path d="M4.75 4.75l1.4 1.4"></path>
                  <path d="M17.85 17.85l1.4 1.4"></path>
                  <path d="M2.75 12h2"></path>
                  <path d="M19.25 12h2"></path>
                  <path d="M4.75 19.25l1.4-1.4"></path>
                  <path d="M17.85 6.15l1.4-1.4"></path>
                </svg>
                <svg class="toolbar-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M19.5 14.2A7.6 7.6 0 0 1 9.8 4.5a8.2 8.2 0 1 0 9.7 9.7z"></path>
                </svg>
              </span>
            </button>
          </div>
        </header>

        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search..." autocomplete="off" />
        </div>

        <nav class="file-tree" id="fileTree" aria-label="Vault files" tabindex="0"></nav>
        <hr id="sidebarTagsResizer" class="resizer-y resizer-sidebar-tags" aria-label="Resize file list and tags">
        <section class="sidebar-tags-pane">
          <div class="pane-header">
            <span>Tags</span>
            <button id="collapseTagsButton" class="pane-collapse-button" type="button" aria-label="Collapse Tags pane">-</button>
          </div>
          <div id="tagCloud" class="tag-cloud" aria-label="Vault tags"></div>
        </section>
        <hr id="sidebarGraphResizer" class="resizer-y resizer-sidebar-graph" aria-label="Resize file list and graph">
        <section class="sidebar-graph-pane">
          <div class="pane-header">
            <span>Graph</span>
            <button id="collapseGraphButton" class="pane-collapse-button" type="button" aria-label="Collapse Graph pane">-</button>
          </div>
          <section id="graph" class="graph-view" aria-label="Graph view">
            <svg id="graphSvg" role="img" aria-label="Note graph"></svg>
            <div id="graphEmpty" class="graph-empty hidden">No links yet</div>
          </section>
        </section>
      </aside>
      <hr id="sidebarResizer" class="resizer resizer-sidebar" aria-label="Resize sidebar">

      <main class="workspace">
        <section class="editor-pane">
          <div class="note-toolbar">
            <div>
              <div class="note-title" id="noteTitle">Open a vault</div>
              <div class="note-path" id="notePath">Choose a local folder to start.</div>
            </div>
            <div class="save-state" id="saveState">Idle</div>
          </div>
          <div id="editorTabs" class="editor-tabs" role="tablist" aria-label="Open files"></div>
          <div id="formattingBar" class="formatting-bar hidden" role="toolbar" aria-label="Formatting">
            <button type="button" class="fmt-button" id="fmtH1" data-tooltip="Heading 1" aria-label="Heading 1">H1</button>
            <button type="button" class="fmt-button" id="fmtH2" data-tooltip="Heading 2" aria-label="Heading 2">H2</button>
            <button type="button" class="fmt-button" id="fmtH3" data-tooltip="Heading 3" aria-label="Heading 3">H3</button>
            <button type="button" class="fmt-button" id="fmtH4" data-tooltip="Heading 4" aria-label="Heading 4">H4</button>
            <div class="fmt-divider" aria-hidden="true"></div>
            <button type="button" class="fmt-button" id="fmtSeparator" data-tooltip="Horizontal rule" aria-label="Horizontal rule">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/></svg>
            </button>
            <button type="button" class="fmt-button" id="fmtList" data-tooltip="Toggle list (⇧⌘8)" aria-label="Toggle list">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/></svg>
            </button>
            <div class="fmt-divider" aria-hidden="true"></div>
            <button type="button" class="fmt-button" id="fmtLink" data-tooltip="Insert link" aria-label="Insert link">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button type="button" class="fmt-button" id="fmtImage" data-tooltip="Insert image" aria-label="Insert image">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
          </div>
          <div class="editor-body">
            <div id="editorFindOverlay" class="editor-find-overlay" aria-hidden="true"></div>
            <textarea id="editor" spellcheck="true" disabled></textarea>
            <div id="imageViewer" class="image-viewer hidden" aria-label="Image viewer">
              <img id="imageViewerImage" alt="">
            </div>
            <div id="findBar" class="find-bar hidden" role="search" aria-label="Find in file">
              <input id="findInput" class="find-input" type="text" placeholder="Find…" autocomplete="off" spellcheck="false" aria-label="Search term">
              <span id="findCount" class="find-count" aria-live="polite"></span>
              <button id="findPrevButton" type="button" class="icon-button find-nav-button" aria-label="Previous match">↑</button>
              <button id="findNextButton" type="button" class="icon-button find-nav-button" aria-label="Next match">↓</button>
              <button id="findCloseButton" type="button" class="icon-button" aria-label="Close find bar">×</button>
            </div>
          </div>
          <div id="mentionMenu" class="mention-menu hidden" aria-label="Select note link"></div>
        </section>
        <hr id="workspaceResizer" class="resizer resizer-workspace" aria-label="Resize editor and preview panes">

        <section class="preview-pane">
          <div class="pane-header preview-header">
            <span>Preview</span>
            <div class="preview-nav-actions" aria-label="Preview navigation">
              <button id="previewBackButton" class="icon-button preview-nav-button" type="button" aria-label="Back" disabled>
                <span aria-hidden="true">‹</span>
              </button>
              <button id="previewForwardButton" class="icon-button preview-nav-button" type="button" aria-label="Forward" disabled>
                <span aria-hidden="true">›</span>
              </button>
            </div>
          </div>
          <article id="preview" class="markdown-preview"></article>
        </section>
      </main>
    </div>

    <div id="treeContextMenu" class="context-menu hidden" role="menu"></div>

    <dialog id="nameDialog" class="modal-backdrop hidden" aria-labelledby="nameDialogTitle">
      <form id="nameForm" class="modal">
        <header class="modal-header">
          <h2 id="nameDialogTitle">New node</h2>
          <button id="cancelNameXButton" class="icon-button" type="button" aria-label="Close">×</button>
        </header>
        <label class="field-label" for="nameInput">Name</label>
        <input id="nameInput" class="modal-input" type="text" value="Untitled" autocomplete="off" />
        <div id="templateRow" class="template-row hidden">
          <label class="field-label" for="templateSelect">Template</label>
          <select id="templateSelect" class="modal-select"></select>
        </div>
        <footer class="modal-actions">
          <button id="cancelNameButton" class="secondary-button" type="button">Cancel</button>
          <button id="confirmNameButton" class="primary-button" type="submit">Create</button>
        </footer>
      </form>
    </dialog>

    <dialog id="settingsDialog" class="modal-backdrop hidden" aria-labelledby="settingsDialogTitle">
      <form id="settingsForm" class="modal">
        <header class="modal-header">
          <h2 id="settingsDialogTitle">Settings</h2>
          <button id="cancelSettingsXButton" class="icon-button" type="button" aria-label="Close">×</button>
        </header>
        <label class="field-label" for="templatesPathInput">Templates folder</label>
        <input id="templatesPathInput" class="modal-input" type="text" autocomplete="off" placeholder=".tektite/templates" />
        <p class="field-hint">Path relative to vault root. Leave blank to use default (<code>.tektite/templates</code>).</p>
        <footer class="modal-actions">
          <button id="cancelSettingsButton" class="secondary-button" type="button">Cancel</button>
          <button id="saveSettingsButton" class="primary-button" type="submit">Save</button>
        </footer>
      </form>
    </dialog>

    <dialog id="gitOutputDialog" class="modal-backdrop hidden" aria-labelledby="gitOutputTitle">
      <form method="dialog" class="modal git-output-modal">
        <header class="modal-header">
          <h2 id="gitOutputTitle">Git Sync</h2>
          <button id="closeGitOutputXButton" class="icon-button" type="button" aria-label="Close">×</button>
        </header>
        <pre id="gitOutputText" class="git-output-text"></pre>
        <footer class="modal-actions">
          <button id="closeGitOutputButton" class="primary-button" type="button">Close</button>
        </footer>
      </form>
    </dialog>

    <script src="./renderer.js"></script>
  </body>
</html>
