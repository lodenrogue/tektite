<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tektite</title>
    <style>
      :root {
        color-scheme: light;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #ffffff;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .splash {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 42px 34px 32px;
        text-align: center;
      }

      .brand {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      img {
        width: 82%;
        max-width: 720px;
        max-height: 62%;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }

      .tagline {
        margin: 18px 0 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
      }

      .meta {
        align-self: end;
        margin: 0;
        color: #444444;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="brand">
        <img src="../assets/app/tektite-splash.png" alt="Tektite">
        <p class="tagline">A lightweight Markdown knowledge base for local folders.</p>
      </div>
      <p class="meta">Tektite v<span id="version">0.1.x</span> by Mathias Conradt · Apache 2.0 license</p>
    </main>
    <script>
      const version = new URLSearchParams(globalThis.location.search).get("version");
      if (version) document.getElementById("version").textContent = version;
    </script>
  </body>
</html>
