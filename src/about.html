<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Tektite</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f3f0e8;
        background: #111318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111318;
      }

      main {
        display: grid;
        min-height: 100vh;
        grid-template-rows: 1fr auto;
        text-align: center;
      }

      .logo-panel {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        padding: 12px 28px;
        background: #ffffff;
      }

      img {
        width: 250px;
        max-width: 100%;
        display: block;
        margin: 0 auto;
        border-radius: 8px;
      }

      .tagline {
        margin: 0;
        color: #111111;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
      }

      .details-panel {
        padding: 24px 28px 30px;
        background: radial-gradient(circle at top, #232733 0, #111318 70%);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 6px 0;
        font-size: 14px;
        line-height: 1.45;
        color: #c8c4bb;
      }

      .version {
        color: #f3f0e8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="logo-panel" aria-label="Tektite logo">
        <img src="../assets/app/tektite-splash.png" alt="Tektite">
        <p class="tagline">A lightweight Markdown knowledge base<br>for local folders.</p>
      </section>
      <section class="details-panel">
        <h1>Tektite</h1>
        <p class="version">Version <span id="version">0.1.3<\/span></p>
        <p>&copy; 2026 Mathias Conradt</p>
        <p>Apache License 2.0</p>
      </section>
    </main>
    <script>
      const version = new URLSearchParams(globalThis.location.search).get("version");
      if (version) document.getElementById("version").textContent = version;
    </script>
  </body>
</html>
