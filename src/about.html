<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Tektite</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f3f0e8;
        background: #111318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #232733 0, #111318 58%);
      }

      main {
        width: min(100%, 380px);
        padding: 28px 28px 30px;
        text-align: center;
      }

      img {
        width: 250px;
        max-width: 100%;
        display: block;
        margin: 0 auto 18px;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 6px 0;
        font-size: 14px;
        line-height: 1.45;
        color: #c8c4bb;
      }

      .version {
        color: #f3f0e8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../tektite-splash.png" alt="Tektite">
      <h1>Tektite</h1>
      <p class="version">Version <span id="version">0.1.0</span></p>
      <p>&copy; 2026 Mathias Conradt</p>
      <p>MIT License</p>
    </main>
    <script>
      const version = new URLSearchParams(window.location.search).get("version");
      if (version) document.getElementById("version").textContent = version;
    </script>
  </body>
</html>
