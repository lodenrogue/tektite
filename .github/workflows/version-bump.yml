name: Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version for app changes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect app changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${before}" "${after}")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi

          app_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|assets/*|scripts/*|Casks/*|package.json|package-lock.json|LICENSE)
                app_changed=true
                ;;
            esac
          done <<< "$changed"

          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.app_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump patch version
        if: steps.changes.outputs.app_changed == 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          ruby -0pi -e "gsub(/version \"[^\"]+\"/, 'version \"' + '${version}' + '\"')" Casks/tektite.rb
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag release
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json Casks/tektite.rb
          git commit -m "chore: bump version to ${version}"
          git tag "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"

  release:
    name: Build and publish release
    needs: bump
    if: needs.bump.outputs.app_changed == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer/renderer.js
          node --check scripts/start.js

      - name: Package macOS app
        run: npx electron-packager . Tektite --platform=darwin --arch=arm64 --icon=assets/icons/tektite-icon.icns --overwrite

      - name: Create Homebrew cask zip
        run: ditto -c -k --sequesterRsrc --keepParent Tektite-darwin-*/Tektite.app Tektite-macOS-arm64.zip

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: Tektite v${{ needs.bump.outputs.version }}
          files: Tektite-macOS-arm64.zip
