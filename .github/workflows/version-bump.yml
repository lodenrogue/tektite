name: Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version for app changes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect app changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${before}" "${after}")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi

          app_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|assets/*|scripts/*|Casks/*|package.json|package-lock.json|LICENSE)
                app_changed=true
                ;;
            esac
          done <<< "$changed"

          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.app_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump patch version
        if: steps.changes.outputs.app_changed == 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          ruby -0pi -e "gsub(/version \"[^\"]+\"/, 'version \"' + '${version}' + '\"')" Casks/tektite.rb
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.changes.outputs.app_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }}"
          file_pattern: package.json package-lock.json Casks/tektite.rb
