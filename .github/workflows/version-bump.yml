name: Version Bump

on:
  push:
    branches: [dev]

jobs:
  bump:
    name: Bump patch version for app changes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect app changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${before}" "${after}")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi

          app_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|assets/*|scripts/*|Casks/*|package.json|package-lock.json|LICENSE)
                app_changed=true
                ;;
            esac
          done <<< "$changed"

          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.app_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump patch version
        if: steps.changes.outputs.app_changed == 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          ruby -0pi -e "gsub(/version \"[^\"]+\"/, 'version \"' + '${version}' + '\"')" Casks/tektite.rb
          ruby -0pi -e "gsub(/<span id=\"version\">[^<]+<\\/span>/, '<span id=\"version\">' + '${version}' + '<\\/span>')" src/about.html
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag release
        if: steps.changes.outputs.app_changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json Casks/tektite.rb src/about.html
          git commit -m "chore: bump version to ${version}"
          git tag "v${version}"
          git push origin HEAD:dev
          git push origin "v${version}"
