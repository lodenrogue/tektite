name: macOS Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tektite for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer/renderer.js
          node --check scripts/start.js

      - name: Package macOS app
        run: npx electron-packager . Tektite --platform=darwin --arch=arm64,x64 --icon=assets/icons/tektite-icon.icns --overwrite

      - name: Create Homebrew cask zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent Tektite-darwin-arm64/Tektite.app Tektite-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent Tektite-darwin-x64/Tektite.app Tektite-macOS-x64.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tektite-macOS
          path: |
            Tektite-macOS-arm64.zip
            Tektite-macOS-x64.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            Tektite-macOS-arm64.zip
            Tektite-macOS-x64.zip
